<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error - PB Client Report Subscription System</title>
</head>
<body>
    <!-- Page Header -->
    <h1>PB Client Report Subscription System</h1>
    
    <!-- Error Message -->
    <div style="text-align: center; padding: 40px; border: 2px solid red; margin: 20px;">
        <h2 style="color: red;">⚠️ System Error</h2>
        <h3 th:text="${error} ?: 'System Error'">System Error</h3>
        <p th:text="${message} ?: 'An unknown error occurred, please try again later'">
            An unknown error occurred, please try again later
        </p>
        
        <!-- Validation Errors -->
        <div th:if="${errors}" style="background-color: #ffe8e8; padding: 15px; margin: 20px 0; border: 1px solid red; text-align: left;">
            <h4 style="color: red;">Validation Errors:</h4>
            <ul>
                <li th:each="error : ${errors}" th:text="${error.key + ': ' + error.value}" style="color: red;">
                    Error message
                </li>
            </ul>
        </div>
        
        <p>
            <a th:href="@{/clients}">Back to Home</a> | 
            <button onclick="history.back()">Go Back</button>
        </p>
    </div>

    <!-- Footer -->
    <hr>
    <p><small>PB Client Report Subscription System</small></p>
</body>
</html>
