<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - PB Client Reporting Subscription System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 4rem;"></i>
                        <h2 class="card-title mt-3" th:text="${error} ?: 'System Error'">System Error</h2>
                        <p class="card-text text-muted" th:text="${message} ?: 'An unknown error occurred, please try again later'">
                            An unknown error occurred, please try again later
                        </p>
                        
                        <!-- Display validation errors -->
                        <div th:if="${errors}" class="mt-3">
                            <h6 class="text-danger">Validation Errors:</h6>
                            <ul class="list-unstyled text-start">
                                <li th:each="error : ${errors}" class="text-danger">
                                    <i class="bi bi-dash-circle"></i>
                                    <span th:text="${error.key + ': ' + error.value}"></span>
                                </li>
                            </ul>
                        </div>
                        
                        <div class="mt-4">
                            <a th:href="@{/clients}" class="btn btn-primary">
                                <i class="bi bi-house"></i> Back to Home
                            </a>
                            <button onclick="history.back()" class="btn btn-outline-secondary ms-2">
                                <i class="bi bi-arrow-left"></i> Go Back
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
