<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - PB Client Report Subscription System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 0 20px;
        }
        .error-card {
            background-color: white;
            padding: 40px;
            border: 1px solid #ddd;
            text-align: center;
        }
        .error-icon {
            font-size: 60px;
            color: #dc3545;
            margin-bottom: 20px;
        }
        .error-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 15px;
        }
        .error-message {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .error-details {
            background-color: #f8f9fa;
            padding: 15px;
            margin: 20px 0;
            border: 1px solid #dee2e6;
            text-align: left;
        }
        .error-details h6 {
            color: #dc3545;
            margin: 0 0 10px 0;
        }
        .error-details ul {
            margin: 0;
            padding-left: 20px;
        }
        .error-details li {
            color: #dc3545;
            margin-bottom: 5px;
        }
        .btn {
            padding: 10px 20px;
            margin: 5px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            border: none;
            cursor: pointer;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-card">
            <div class="error-icon">⚠️</div>
            <h2 class="error-title" th:text="${error} ?: 'System Error'">System Error</h2>
            <p class="error-message" th:text="${message} ?: 'An unknown error occurred, please try again later'">
                An unknown error occurred, please try again later
            </p>
            
            <!-- Display validation errors -->
            <div th:if="${errors}" class="error-details">
                <h6>Validation Errors:</h6>
                <ul>
                    <li th:each="error : ${errors}" th:text="${error.key + ': ' + error.value}">
                        Error message
                    </li>
                </ul>
            </div>
            
            <div>
                <a th:href="@{/clients}" class="btn btn-primary">Back to Home</a>
                <button onclick="history.back()" class="btn btn-secondary">Go Back</button>
            </div>
        </div>
    </div>
</body>
</html>
