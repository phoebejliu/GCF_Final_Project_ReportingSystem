<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${client.id != null ? 'Edit Client' : 'Add New Client'} + ' - PB Client Report Subscription System'">Client Form</title>
</head>
<body>
    <!-- Page Header -->
    <h1>PB Client Report Subscription System</h1>
    
    <!-- Navigation -->
    <p>
        <a th:href="@{/clients}">Client Management</a>
    </p>

    <!-- Messages -->
    <div th:if="${errorMessage}" style="color: red; background-color: #ffe8e8; padding: 10px; border: 1px solid red;">
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- Page Title -->
    <h2 th:text="${client.id != null ? 'Edit Client' : 'Add New Client'}">Client Form</h2>
    <p>Create or update client information</p>
    <p><a th:href="@{/clients}">Back to Client List</a></p>

    <!-- Client Form -->
    <form th:action="${client.id != null ? '/clients/' + client.id : '/clients'}" 
          th:object="${client}" method="post">
        
        <!-- Client Name -->
        <p>
            <label for="name">Client Name <span style="color: red;">*</span></label><br>
            <input type="text" 
                   id="name" 
                   th:field="*{name}" 
                   placeholder="Enter client name"
                   required
                   style="width: 300px; padding: 5px;">
            <br><small>Name of the client company or organization</small>
        </p>

        <!-- Email -->
        <p>
            <label for="email">Email Address</label><br>
            <input type="email" 
                   id="email" 
                   th:field="*{email}" 
                   placeholder="Enter email address"
                   style="width: 300px; padding: 5px;">
            <br><small>Contact email for this client (optional)</small>
        </p>

        <!-- Submit Buttons -->
        <p>
            <a th:href="@{/clients}">Cancel</a> | 
            <button type="submit">
                <span th:text="${client.id != null ? 'Update Client' : 'Create Client'}">Submit</span>
            </button>
        </p>
    </form>

    <!-- Footer -->
    <hr>
    <p><small>PB Client Report Subscription System</small></p>
</body>
</html>
