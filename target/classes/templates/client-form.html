<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${client.id != null ? 'Edit Client' : 'Add New Client'} + ' - PB Client Reporting Subscription System'">Client Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/clients}">
                <i class="bi bi-building"></i> PB Client Reporting
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Page Title -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1>
                    <i class="bi bi-person-plus" th:if="${client.id == null}"></i>
                    <i class="bi bi-person-check" th:if="${client.id != null}"></i>
                    <span th:text="${client.id != null ? 'Edit Client' : 'Add New Client'}">Add New Client</span>
                </h1>
                <p class="text-muted">Fill in client basic information</p>
            </div>
            <a th:href="@{/clients}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back to List
            </a>
        </div>

        <!-- Client Form -->
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <form th:action="${client.id != null ? '/clients/' + client.id : '/clients'}" 
                              th:object="${client}" method="post">
                            
                            <!-- Client Name -->
                            <div class="mb-3">
                                <label for="name" class="form-label">
                                    <i class="bi bi-building"></i> Client Name <span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" 
                                       placeholder="Enter client name" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" 
                                     th:errors="*{name}">Client name cannot be empty</div>
                            </div>

                            <!-- Primary Contact Email -->
                            <div class="mb-3">
                                <label for="primaryContactEmail" class="form-label">
                                    <i class="bi bi-envelope"></i> Primary Contact Email
                                </label>
                                <input type="email" class="form-control" id="primaryContactEmail" 
                                       th:field="*{primaryContactEmail}" 
                                       placeholder="Enter email address">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('primaryContactEmail')}" 
                                     th:errors="*{primaryContactEmail}">Invalid email format</div>
                                <div class="form-text">Email address for receiving report notifications</div>
                            </div>

                            <!-- FTP Path -->
                            <div class="mb-3">
                                <label for="ftpPath" class="form-label">
                                    <i class="bi bi-folder"></i> FTP Path
                                </label>
                                <input type="text" class="form-control" id="ftpPath" th:field="*{ftpPath}" 
                                       placeholder="e.g., /ftp/clients/client001">
                                <div class="form-text">Path for FTP delivery method</div>
                            </div>

                            <!-- Button Group -->
                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/clients}" class="btn btn-outline-secondary">
                                    <i class="bi bi-x-circle"></i> Cancel
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i>
                                    <span th:text="${client.id != null ? 'Update Client' : 'Create Client'}">Create Client</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 表单验证
        (function() {
            'use strict';
            window.addEventListener('load', function() {
                var forms = document.getElementsByTagName('form');
                var validation = Array.prototype.filter.call(forms, function(form) {
                    form.addEventListener('submit', function(event) {
                        if (form.checkValidity() === false) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        form.classList.add('was-validated');
                    }, false);
                });
            }, false);
        })();
    </script>
</body>
</html>
