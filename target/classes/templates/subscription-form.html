<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${subscription.id != null ? 'Edit Subscription' : 'Add New Subscription'} + ' - ' + ${client.name}">Subscription Form</title>
</head>
<body>
    <!-- Page Header -->
    <h1>PB Client Report Subscription System</h1>
    
    <!-- Navigation -->
    <p>
        <a th:href="@{/clients}">Client Management</a>
    </p>

    <!-- Messages -->
    <div th:if="${errorMessage}" style="color: red; background-color: #ffe8e8; padding: 10px; border: 1px solid red;">
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- Page Title -->
    <h2 th:text="${subscription.id != null ? 'Edit Subscription' : 'Add New Subscription'}">Subscription Form</h2>
    <p th:text="'Client: ' + ${client.name}">Client: Client Name</p>
    <p><a th:href="@{/clients/{id}(id=${client.id})}">Back to Client Details</a></p>

    <!-- Subscription Form -->
    <form th:action="${subscription.id != null ? '/clients/' + client.id + '/subscriptions/' + subscription.id : '/clients/' + client.id + '/subscriptions'}" 
          th:object="${subscription}" method="post">
        
        <!-- Report Type -->
        <p>
            <label for="reportType">Report Type <span style="color: red;">*</span></label><br>
            <select id="reportType" th:field="*{reportType}" required style="width: 300px; padding: 5px;">
                <option value="">Please select report type</option>
                <option value="TRADE_CONFIRM">Trade Confirmation</option>
                <option value="OPTIONS_EXPIRY">Options Expiry</option>
                <option value="MARGIN_CALL">Margin Call</option>
                <option value="STATEMENT">Account Statement</option>
                <option value="DAILY_PNL">Daily P&L</option>
            </select>
            <br><small>Type of report to be generated</small>
        </p>

        <!-- Frequency -->
        <p>
            <label for="frequency">Frequency <span style="color: red;">*</span></label><br>
            <select id="frequency" th:field="*{frequency}" required style="width: 300px; padding: 5px;">
                <option value="">Please select frequency</option>
                <option value="Daily">Daily</option>
                <option value="Weekly">Weekly</option>
                <option value="Monthly">Monthly</option>
                <option value="Quarterly">Quarterly</option>
                <option value="Yearly">Yearly</option>
            </select>
            <br><small>Frequency of report generation</small>
        </p>

        <!-- Format -->
        <p>
            <label for="format">Format <span style="color: red;">*</span></label><br>
            <select id="format" th:field="*{format}" required style="width: 300px; padding: 5px;">
                <option value="">Please select format</option>
                <option value="PDF">PDF</option>
                <option value="CSV">CSV</option>
                <option value="Excel">Excel</option>
                <option value="XML">XML</option>
            </select>
            <br><small>File format of the report</small>
        </p>

        <!-- Delivery Method -->
        <p>
            <label for="deliveryMethod">Delivery Method <span style="color: red;">*</span></label><br>
            <select id="deliveryMethod" th:field="*{deliveryMethod}" required style="width: 300px; padding: 5px;">
                <option value="">Please select delivery method</option>
                <option value="Email">Email</option>
                <option value="FTP">FTP</option>
                <option value="SFTP">SFTP</option>
                <option value="API">API</option>
            </select>
            <br><small>Method of report delivery</small>
        </p>

        <!-- Submit Buttons -->
        <p>
            <a th:href="@{/clients/{id}(id=${client.id})}">Cancel</a> | 
            <button type="submit">
                <span th:text="${subscription.id != null ? 'Update Subscription' : 'Create Subscription'}">Submit</span>
            </button>
        </p>
    </form>

    <!-- Footer -->
    <hr>
    <p><small>PB Client Report Subscription System</small></p>
</body>
</html>
