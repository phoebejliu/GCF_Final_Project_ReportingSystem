<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title} ?: 'PB Client Report Subscription System'">PB Client Report Subscription System</title>
</head>
<body>
    <!-- Page Header -->
    <h1>PB Client Report Subscription System</h1>
    
    <!-- Navigation -->
    <p>
        <a th:href="@{/clients}">Client Management</a>
    </p>

    <!-- Messages -->
    <div th:if="${successMessage}" style="color: green; background-color: #e8f5e8; padding: 10px; border: 1px solid green;">
        <span th:text="${successMessage}"></span>
    </div>
    
    <div th:if="${errorMessage}" style="color: red; background-color: #ffe8e8; padding: 10px; border: 1px solid red;">
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- Content -->
    <div th:fragment="content">
        <!-- Page content goes here -->
    </div>

    <!-- Footer -->
    <hr>
    <p><small>PB Client Report Subscription System</small></p>
</body>
</html>
